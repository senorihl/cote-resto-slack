name: Tests et release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: false
      - run: go mod download
      - run: go test ./...
      - run: go vet ./...

  release:
    name: Construire et publier les exécutables
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go mod download
      - name: Compilation multiplateforme
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              output="dist/cote-resto-${os}-${arch}"
              if [ "$os" = windows ]; then output="${output}.exe"; fi
              GOOS="$os" GOARCH="$arch" go build -trimpath -o "$output" .
            done
          done
      - name: Créer la release et joindre les exécutables
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
